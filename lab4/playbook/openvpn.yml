---
- name: Установка и настройка OpenVPN сервера
  hosts: vpn_servers
  become: true
  
  pre_tasks:
    - name: Обновление кэша пакетов
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
  
  roles:
    - role: openvpn
      vars:
        openvpn_port: 1194
        openvpn_proto: udp
        openvpn_network: "10.8.0.0"
        openvpn_netmask: "255.255.255.0"
        openvpn_client_name: "client"
        openvpn_server_hostname: "{{ ansible_host }}"
  
  post_tasks:
    - name: Копирование клиентской конфигурации в директорию плейбука
      fetch:
        src: "{{ openvpn_client_config_path }}/{{ openvpn_client_name }}.ovpn"
        dest: "{{ playbook_dir }}/client.ovpn"
        flat: yes
      when: ansible_virtualization_type != 'docker' 