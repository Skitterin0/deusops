---
- name: Включение пересылки пакетов в sysctl
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Настройка правил iptables MASQUERADE
  iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ openvpn_network }}/{{ openvpn_cidr }}"
    jump: MASQUERADE
    state: present
  register: iptables_masquerade

- name: Сохранение правил iptables
  command: "netfilter-persistent save"
  when: iptables_masquerade.changed 