---
# Основные настройки OpenVPN
openvpn_port: 1194
openvpn_proto: udp
openvpn_dev: tun
openvpn_network: "10.8.0.0"
openvpn_netmask: "255.255.255.0"
openvpn_server_hostname: "{{ ansible_default_ipv4.address }}"

# DNS серверы для клиентов
openvpn_dns_servers:
  - "8.8.8.8"
  - "8.8.4.4"

# Параметры безопасности
openvpn_cipher: "AES-256-CBC"
openvpn_auth: "SHA256"
openvpn_key_size: 2048
openvpn_ca_expire: 3650
openvpn_cert_expire: 3650
openvpn_crl_days: 3650
openvpn_dh_size: 2048
openvpn_tls_version_min: "1.2"

# Пути к файлам
openvpn_server_config_dir: "/etc/openvpn/server"
openvpn_easy_rsa_dir: "/etc/openvpn/easy-rsa"
openvpn_client_config_path: "/etc/openvpn"

# Клиентские настройки
openvpn_client_name: "client"
openvpn_client_config_template: "client.ovpn.j2" 