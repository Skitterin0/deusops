---
# Версия и пути PostgreSQL
postgresql_version: "14"
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/main"
postgresql_bin_path: "/usr/lib/postgresql/{{ postgresql_version }}/bin"
postgresql_config_path: "/etc/postgresql/{{ postgresql_version }}/main"

# Сетевые настройки
postgresql_listen_addresses: "localhost"
postgresql_port: 5432
postgresql_max_connections: 100

# Настройки памяти и производительности
postgresql_shared_buffers: "128MB"
postgresql_work_mem: "4MB"
postgresql_effective_cache_size: "128MB"

# Настройки для логирования
postgresql_log_destination: "stderr"
postgresql_logging_collector: "on"
postgresql_log_directory: "pg_log"
postgresql_log_filename: "postgresql-%Y-%m-%d_%H%M%S.log"
postgresql_log_rotation_age: "1d"
postgresql_log_rotation_size: "10MB"

# Настройки для массового создания баз данных и пользователей
postgresql_databases: []
postgresql_users: []

# Настройки для streaming репликации
postgresql_is_master: false
postgresql_replica_user: "replicator"
postgresql_replica_password: "secure_replication_password" 