---
- name: Добавление ключа репозитория PostgreSQL
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Добавление репозитория PostgreSQL
  apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    update_cache: yes

- name: Установка PostgreSQL и зависимостей
  apt:
    name: 
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-contrib-{{ postgresql_version }}"
      - python3-psycopg2
    state: present

- name: Проверка существования каталога данных
  stat:
    path: "{{ postgresql_data_dir }}"
  register: data_dir_stat

- name: Остановка PostgreSQL перед изменением каталога данных
  service:
    name: postgresql
    state: stopped
  when: postgresql_data_dir != "/var/lib/postgresql/{{ postgresql_version }}/main" and not data_dir_stat.stat.exists

- name: Создание каталога данных PostgreSQL
  file:
    path: "{{ postgresql_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  when: not data_dir_stat.stat.exists

- name: Инициализация нового каталога данных
  become: yes
  become_user: postgres
  command: "{{ postgresql_bin_path }}/initdb -D {{ postgresql_data_dir }}"
  when: postgresql_data_dir != "/var/lib/postgresql/{{ postgresql_version }}/main" and not data_dir_stat.stat.exists

- name: Настройка postgresql.conf
  template:
    src: postgresql.conf.j2
    dest: "{{ postgresql_config_path }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: '0644'
  notify: restart postgresql

- name: Настройка pg_hba.conf
  template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_config_path }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: '0644'
  notify: restart postgresql

- name: Запуск и включение сервиса PostgreSQL
  service:
    name: postgresql
    state: started
    enabled: yes

- name: Создание пользователей PostgreSQL
  postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    role_attr_flags: "{{ item.role_attr_flags | default(omit) }}"
    state: present
  with_items: "{{ postgresql_users }}"
  become: yes
  become_user: postgres
  when: postgresql_users | length > 0

- name: Создание баз данных PostgreSQL
  postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner | default(omit) }}"
    encoding: "{{ item.encoding | default('UTF-8') }}"
    state: present
  with_items: "{{ postgresql_databases }}"
  become: yes
  become_user: postgres
  when: postgresql_databases | length > 0

- name: Назначение привилегий для баз данных
  postgresql_privs:
    database: "{{ item.database }}"
    roles: "{{ item.name }}"
    privs: "{{ item.privileges }}"
    type: database
    grant_option: no
  with_items: "{{ postgresql_users }}"
  become: yes
  become_user: postgres
  when: postgresql_users | length > 0 and item.privileges is defined and item.database is defined

# Блок настройки репликации
- name: Создание пользователя для репликации
  postgresql_user:
    name: "{{ postgresql_replica_user }}"
    password: "{{ postgresql_replica_password }}"
    role_attr_flags: "REPLICATION"
    state: present
  become: yes
  become_user: postgres
  when: postgresql_is_master 