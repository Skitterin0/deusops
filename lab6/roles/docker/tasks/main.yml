---
- name: Добавление ключа репозитория Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Добавление репозитория Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

- name: Установка Docker и зависимостей
  apt:
    name: "{{ item }}"
    state: present
  with_items:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - python3-docker

- name: Запуск и включение сервиса Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Добавление пользователей в группу docker
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  with_items: "{{ docker_users | default([]) }}"
  when: docker_users is defined 