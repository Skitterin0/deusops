---
- name: Добавление ключа репозитория Grafana
  apt_key:
    url: https://packages.grafana.com/gpg.key
    state: present

- name: Добавление репозитория Grafana
  apt_repository:
    repo: "deb https://packages.grafana.com/oss/deb stable main"
    state: present
    update_cache: yes

- name: Установка Grafana
  apt:
    name: grafana
    state: present

- name: Создание директории для дашбордов Grafana
  file:
    path: /etc/grafana/provisioning/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'

- name: Создание директории для источников данных Grafana
  file:
    path: /etc/grafana/provisioning/datasources
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'

- name: Настройка источников данных Grafana
  template:
    src: datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/datasources.yml
    owner: grafana
    group: grafana
    mode: '0644'
  notify: restart grafana

- name: Настройка конфигурации дашбордов Grafana
  template:
    src: dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    owner: grafana
    group: grafana
    mode: '0644'
  notify: restart grafana

- name: Создание директории для JSON-файлов дашбордов
  file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'

- name: Скачивание дашбордов из Grafana.com
  get_url:
    url: "https://grafana.com/api/dashboards/{{ item.dashboard_id }}/revisions/{{ item.revision_id }}/download"
    dest: "/var/lib/grafana/dashboards/dashboard-{{ item.dashboard_id }}.json"
    owner: grafana
    group: grafana
    mode: '0644'
  with_items: "{{ grafana_dashboards | default([]) }}"
  when: grafana_dashboards is defined and grafana_dashboards | length > 0

- name: Обработка JSON-файлов дашбордов для замены источников данных
  replace:
    path: "/var/lib/grafana/dashboards/dashboard-{{ item.dashboard_id }}.json"
    regexp: '"datasource":".*?"'
    replace: '"datasource":"{{ item.datasource }}"'
  with_items: "{{ grafana_dashboards | default([]) }}"
  when: grafana_dashboards is defined and grafana_dashboards | length > 0

- name: Настройка пользователя администратора Grafana
  template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: grafana
    group: grafana
    mode: '0644'
  notify: restart grafana

- name: Включение и запуск сервиса Grafana
  systemd:
    name: grafana-server
    state: started
    enabled: yes
    daemon_reload: yes 