---
- name: Add SSH key to all hosts
  hosts: all
  gather_facts: no
  tasks:
    - name: Create .ssh directory
      file:
        path: /home/vagrant/.ssh
        state: directory
        mode: '0700'
      
    - name: Add SSH key
      lineinfile:
        path: /home/vagrant/.ssh/authorized_keys
        line: 'ssh-rsa  dan19@SayNyaOrDie'
        create: yes
        mode: '0600' 